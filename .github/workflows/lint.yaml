name: Lint code

on:
  push:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=4m
      - name: Check documentation links
        # Always, so that a broken link is reported in the same run as
        # whatever golangci-lint found rather than in the one after the fix.
        if: ${{ !cancelled() }}
        run: go run github.com/magefile/mage docs:links
